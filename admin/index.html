<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | Панель управления АИС «Каталог Кристи» — Django</title>
    <style>
        :root {
            --primary: #2d4a22;
            --primary-hover: #1c3014;
            --accent: #c5a880;
            --bg: #f2f4f0;
            --text-dark: #192015;
            --border: #e2e6df;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .login-container {
            width: 100%; max-width: 400px;
            background: #fff; border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden;
        }
        .login-header {
            background-color: #1c2519; padding: 20px; text-align: center; border-bottom: 3px solid var(--accent);
        }
        .login-header h1 { color: #fff; margin: 0; font-size: 1.3rem; font-weight: 800; }
        .login-header span { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; margin-top: 5px; display: block; }
        .login-body { padding: 30px; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; font-weight: 600; color: #5a6255; }
        .form-group input { padding: 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.95rem; outline: none; }
        .btn-submit { background-color: var(--primary); color: #fff; padding: 12px; font-size: 0.95rem; font-weight: 700; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        .btn-submit:hover { background-color: var(--primary-hover); }
        .error-message { color: #ef4444; font-size: 0.85rem; margin-bottom: 15px; display: none; text-align: center; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>КРИСТИ ЛМС</h1>
            <span>Авторизация администратора</span>
        </div>
        <div class="login-body">
            <div class="error-message" id="errorMsg">Неверный логин или пароль!</div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Имя пользователя / Email</label>
                    <input type="text" id="username" required placeholder="admin@kristi.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Войти в панель</button>
            </form>
            <a href="../index.html" style="display:block; text-align:center; margin-top:20px; font-size:0.85rem; color:#5a6255; text-decoration:none;">← Вернуться на сайт</a>
        </div>
    </div>

    <script>
        const DB_URL = 'ВСТАВЬТЕ_СЮДА_ВАШ_PROJECT_URL';
        const DB_KEY = 'ВСТАВЬТЕ_СЮДА_ВАШ_ANON_KEY';

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const error = document.getElementById('errorMsg');

            // Запрос авторизации напрямую к облачной СУБД PostgreSQL
            fetch(`${DB_URL}/rest/v1/users?username=eq.${u}&password=eq.${p}`, {
                method: 'GET',
                headers: {
                    'apikey': DB_KEY,
                    'Authorization': 'Bearer ' + DB_KEY
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.length > 0) {
                    sessionStorage.setItem('kristi_logged_in', 'true');
                    sessionStorage.setItem('kristi_user_name', data[0].name);
                    window.location.href = '../dashboard.html';
                } else {
                    error.style.display = 'block';
                }
            })
            .catch(() => {
                error.textContent = 'Ошибка подключения к базе данных.';
                error.style.display = 'block';
            });
        });
    </script>
</body>
</html>
