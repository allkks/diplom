<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Панель управления АИС «Каталог Кристи» — Django</title>
    <style>
        :root {
            --primary: #2d4a22; /* Наш хвойно-зеленый цвет */
            --primary-hover: #1c3014;
            --accent: #c5a880;
            --bg: #f2f4f0;
            --text-dark: #192015;
            --border: #e2e6df;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .login-header {
            background-color: #1c2519;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }
        .login-header h1 {
            color: #fff;
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.05em;
        }
        .login-header span {
            color: var(--accent);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: block;
            margin-top: 5px;
        }
        .login-body {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #5a6255;
        }
        .form-group input {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fafbfa;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
            background-color: #fff;
        }
        .btn-submit {
            background-color: var(--primary);
            color: #fff;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #5a6255;
            text-decoration: none;
        }
        .back-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>КРИСТИ ЛМС</h1>
            <span>Авторизация администратора</span>
        </div>
        <div class="login-body">
            <div class="error-message" id="errorMsg">Неверный логин или пароль!</div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Имя пользователя / Email</label>
                    <input type="text" id="username" required placeholder="admin@kristi.ru">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Войти в панель</button>
            </form>
            <a href="../index.html" class="back-link">← Вернуться на сайт</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const error = document.getElementById('errorMsg');

            // Проверка логина и пароля
            if (u === 'admin@kristi.ru' && p === 'admin') {
                error.style.display = 'none';
                sessionStorage.setItem('kristi_logged_in', 'true'); // Записываем сессию авторизации
                window.location.href = '../dashboard.html'; // Перенаправляем в панель управления
            } else {
                error.style.display = 'block';
            }
        });
    </script>
</body>
</html>
